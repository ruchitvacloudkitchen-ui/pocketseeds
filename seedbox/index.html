<style>
:root{
  --bg:#F5F7F6; --surface:#FFFFFF; --surface-2:#F2F6F3;
  --ink:#0E1B14; --muted:#6B7A72; --line:#E4EBE6;
  --brand:#0B7A43; --brand-2:#16A34A; --on-brand:#FFFFFF;
  --in-bg:#E6F4EC; --warn:#B45309; --warn-bg:#FEF3C7;
  --radius:18px; --shadow:0 1px 3px rgba(14,27,20,.06),0 6px 18px rgba(14,27,20,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0A120E;--surface:#121D17;--surface-2:#0E1712;--ink:#E7F0EA;
  --muted:#8FA398;--line:#1F2E26;--brand:#34D399;--brand-2:#34D399;--on-brand:#06231A;--in-bg:#0C2A1D;
  --warn:#FCD34D;--warn-bg:#2E2410;--shadow:0 2px 12px rgba(0,0,0,.45)}
}
:root[data-theme="dark"]{--bg:#0A120E;--surface:#121D17;--surface-2:#0E1712;--ink:#E7F0EA;
  --muted:#8FA398;--line:#1F2E26;--brand:#34D399;--brand-2:#34D399;--on-brand:#06231A;--in-bg:#0C2A1D;
  --warn:#FCD34D;--warn-bg:#2E2410;--shadow:0 2px 12px rgba(0,0,0,.45)}

*{box-sizing:border-box}
html,body{background:var(--bg);margin:0}
body{font-family:'Plus Jakarta Sans','Noto Sans Telugu',system-ui,-apple-system,sans-serif;
  color:var(--ink);line-height:1.6;font-size:16px;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 60px}

/* ---------- chrome ---------- */
header{display:flex;align-items:center;gap:11px;padding:4px 0 14px}
.mark{width:34px;height:34px;flex:none}
.brand{font-weight:800;font-size:19px;letter-spacing:-.3px;flex:1}
.brand span{color:var(--brand)}
.lang{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:11px;overflow:hidden}
.lang button{border:0;background:none;font-family:inherit;font-size:13px;font-weight:800;color:var(--muted);
  padding:0 10px;height:32px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}

/* ---------- hero ---------- */
.hero{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:22px;
  padding:20px 18px;box-shadow:var(--shadow);overflow:hidden}
.eyebrow{font-size:13.5px;font-weight:800;letter-spacing:.02em;color:var(--brand);margin:0 0 9px}
.pill{display:inline-block;background:#1B5E34;color:#fff;font-weight:800;font-size:20px;letter-spacing:-.01em;
  border-radius:999px;padding:10px 18px;margin:0 0 14px}
.shot{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;border-radius:16px;
  background:var(--surface-2);border:1px solid var(--line)}
/* The tagline sits under the title and stays on one line — it is a saying,
   and a saying broken across two lines stops sounding like one. */
.tagline{margin:9px 0 0;font-size:14.5px;font-weight:700;color:var(--brand);line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ribbon{position:absolute;top:16px;right:-42px;transform:rotate(45deg);background:#B0431A;color:#fff;
  font-size:11px;font-weight:800;letter-spacing:.04em;padding:6px 46px;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.cta{display:flex;flex-direction:column;gap:9px;margin-top:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:13px;
  padding:14px 16px;font-family:inherit;font-size:16.5px;font-weight:800;cursor:pointer;text-decoration:none}
.btn-p{background:var(--brand);color:var(--on-brand)}
.btn-g{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn:focus-visible{outline:3px solid #2E8B49;outline-offset:2px}

/* ---------- blocks ---------- */
section{background:var(--surface);border:1px solid var(--line);border-radius:20px;
  padding:18px;margin:14px 0 0;box-shadow:var(--shadow)}
h2{font-size:18.5px;margin:0 0 4px;letter-spacing:-.2px}
h2 .te{display:block;font-size:15px;color:var(--brand);font-weight:700;margin-bottom:2px}
.sub{color:var(--muted);font-size:14.5px;margin:0 0 14px}

.feat{display:grid;gap:12px}
@media (min-width:560px){ .feat{grid-template-columns:repeat(3,1fr)} }
.feat > div{display:flex;gap:11px;align-items:flex-start}
.feat .ic{width:40px;height:40px;border-radius:13px;flex:none;display:grid;place-items:center;font-size:20px;
  background:var(--in-bg)}
.feat b{display:block;font-size:15.5px}
.feat p{margin:2px 0 0;font-size:13.5px;color:var(--muted);line-height:1.45}

/* horizontal snap on a phone, plain grid once there is room */
.gifts{display:flex;gap:11px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;
  scrollbar-width:none;margin:0 -18px;padding-left:18px;padding-right:18px}
.gifts::-webkit-scrollbar{display:none}
.gifts > div{flex:0 0 62%;scroll-snap-align:start;background:var(--surface-2);border:1px solid var(--line);
  border-radius:16px;padding:15px}
@media (min-width:560px){
  .gifts{display:grid;grid-template-columns:repeat(5,1fr);overflow:visible;margin:0;padding:0}
  .gifts > div{flex:auto}
}
.gifts .ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:21px;margin-bottom:9px}
.gifts b{display:block;font-size:15.5px}
.gifts p{margin:3px 0 0;font-size:13px;color:var(--muted);line-height:1.4}

.trust{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.trust div{display:flex;align-items:center;gap:9px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:13px;padding:11px 12px;font-size:13.5px;font-weight:700}
.trust span{font-size:17px}
.hl{margin-top:11px;background:var(--in-bg);border:1px solid var(--line);border-radius:14px;
  padding:13px 14px;font-size:14px;font-weight:700;color:var(--brand);line-height:1.45}

ol.steps{margin:0;padding:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;padding:11px 0;
  border-bottom:1px dashed var(--line)}
ol.steps li:last-child{border:0;padding-bottom:0}
ol.steps li::before{content:counter(s);flex:none;width:29px;height:29px;border-radius:50%;
  background:var(--brand);color:var(--on-brand);font-weight:800;font-size:14px;display:grid;place-items:center}
ol.steps b{display:block;font-size:15.5px}
ol.steps p{margin:2px 0 0;font-size:13.5px;color:var(--muted);line-height:1.45}

details{border-bottom:1px solid var(--line)}
details:last-of-type{border:0}
summary{cursor:pointer;list-style:none;padding:13px 0;font-weight:700;font-size:15.5px;
  display:flex;justify-content:space-between;gap:10px;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:'+';color:var(--brand);font-weight:800;font-size:19px}
details[open] summary::after{content:'–'}
details p{margin:0 0 13px;font-size:14.5px;color:var(--muted);line-height:1.55}

footer{text-align:center;color:var(--muted);font-size:14px;padding:22px 0 0;margin-top:20px;
  border-top:1px solid var(--line)}
footer a{color:var(--brand);font-weight:700}
.te{font-family:'Noto Sans Telugu','Plus Jakarta Sans',sans-serif}
</style>
</head>

    s1t:'Drop a cell\u2019s worth in', s1s:'Whatever that cell is printed with — ₹500, ₹200 or ₹100.',
    s2t:'Tap that cell in the app', s2s:'Scanning the QR opens your box straight away.',
    s3t:'Watch the bar fill', s3s:'Every rupee counted, all the way to ₹1,00,000.',
    faqTe:'సందేహాలు', faqEn:'Questions',
    q1:'Can I use the app without the box?', a1:'Yes. The app is free and always will be. The box is a physical nudge, nothing more.',
    q2:'Does it need the internet?', a2:'No. The count lives on your phone. Sign in and it also backs up to your own Google Drive.',
    q3:'What if I change phones?', a3:'Signed in, nothing is lost. Otherwise enter the box number again and re-tap the filled cells.',
    q4:'What if I tap the wrong cell?', a4:'Tap it again to undo, or use the "Undo last" button.',
    q5:'Can I track more than one box?', a5:'Yes. Each box is counted separately under its own number.',
    closeT:'Shall we start?', closeS:'One cell. One day. One lakh.',
    backApp:'Back to the app',
    waMsg:'Hello! I would like a PocketSeeds Seed Box (₹1,00,000 savings tracker).',
    waMsgRef:'Hello! I would like a PocketSeeds Seed Box (₹1,00,000 savings tracker). My current box: {b}'
  }
};

/* the language and theme the app is already set to, so nothing changes underfoot */
let LMODE = localStorage.getItem('pocketseeds.lmode') === 'en' ? 'en' : 'te';
const t = (k, vars) => {
  let out = (STR[LMODE] && STR[LMODE][k]) || STR.en[k] || k;
  if(vars) Object.keys(vars).forEach(n => { out = out.split('{' + n + '}').join(vars[n]); });
  return out;
};

(function theme(){
  const v = localStorage.getItem('pocketseeds.theme') || 'auto';
  if(v !== 'auto') document.documentElement.setAttribute('data-theme', v);
})();

const GIFTS = [
  { k:'g1', s:'g1s', bg:'#DFEFE2', fg:'#25743D', ic:'🧒' },
  { k:'g2', s:'g2s', bg:'#FCE4EF', fg:'#A31D62', ic:'🤝' },
  { k:'g3', s:'g3s', bg:'#EDE4F8', fg:'#5B3FA8', ic:'👧' },
  { k:'g4', s:'g4s', bg:'#DCEBF8', fg:'#1163A8', ic:'👦' },
  { k:'g5', s:'g5s', bg:'#FCE9DC', fg:'#B0431A', ic:'👨‍👩‍👧' }
];
const FAQ = [['q1','a1'],['q2','a2'],['q3','a3'],['q4','a4'],['q5','a5']];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function paint(){
  document.documentElement.lang = LMODE;
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll('#langPick button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.lang === LMODE)));

  document.getElementById('gifts').innerHTML = GIFTS.map(g => `
    <div><span class="ic" style="background:${g.bg};color:${g.fg}">${g.ic}</span>
      <b>${esc(t(g.k))}</b><p>${esc(t(g.s))}</p></div>`).join('');

  document.getElementById('faq').innerHTML = FAQ.map(([q,a]) => `
    <details><summary>${esc(t(q))}</summary><p>${esc(t(a))}</p></details>`).join('');

  /* With no number set the button would be a dead link, so it says so instead
     of pretending to work. */
  /* ?ref=BOX0311 arrives when the reader came from a box they already own, so
     the order can name it. Validated against the same shape the tracker
     accepts before it is used — the query string is not to be trusted, and it
     ends up in a message sent to a real person. */
  const ref = (() => {
    try{
      const r = new URLSearchParams(location.search).get('ref') || '';
      return /^BOX\d{4,6}$/.test(r.trim().toUpperCase()) ? r.trim().toUpperCase() : '';
    }catch(e){ return ''; }
  })();
  const msg = ref ? t('waMsgRef', { b: ref }) : t('waMsg');
  /* wa.me wants the digits only, and the text percent-encoded */
  const href = MB_WA ? 'https://wa.me/' + MB_WA + '?text=' + encodeURIComponent(msg) : '';
  ['waBtn','waBtn2'].forEach(id => {
    const b = document.getElementById(id);
    if(!b) return;
    if(href){ b.href = href; b.removeAttribute('aria-disabled'); }
    else { b.removeAttribute('href'); b.setAttribute('aria-disabled','true'); b.style.opacity = '.55'; }
  });
}
document.getElementById('langPick').addEventListener('click', e => {
  const b = e.target.closest('button[data-lang]'); if(!b || b.dataset.lang === LMODE) return;
  LMODE = b.dataset.lang;
  localStorage.setItem('pocketseeds.lmode', LMODE);
  paint();
});
/* The photo is optional the same way the app's banners are: if it is not in
   the repo the image removes itself rather than showing a broken box. It
   tries the old moneybox-hero.jpg once before giving up, because that file
   was already being produced under the old name when the feature was
   renamed. */
(function(){
  const s = document.getElementById('shot');
  let tried = false;
  s.addEventListener('error', () => {
    if(!tried){ tried = true; s.src = '../moneybox-hero.jpg'; return; }
    s.remove();
  });
})();
paint();
/* config.json is same-origin and cached by the service worker; if it cannot
   be read the number stays empty, which is the safe state — the button says
   so rather than pretending to work. */
fetch('../config.json', { cache:'no-cache' })
  .then(r => r.ok ? r.json() : null)
  .then(c => { if(c && typeof c.seedBoxWhatsApp === 'string'){ MB_WA = c.seedBoxWhatsApp.trim(); paint(); } })
  .catch(() => {});
</script>
</body>
</html>
