<title>Seed Box — PocketSeeds</title>
<!-- The feature was called Money Box before launch and this path was shared,
     so it stays for good. GitHub Pages serves static files and cannot send a
     real 301, so this is the static equivalent: a canonical link for crawlers,
     a meta refresh for readers with JavaScript off, and a replace() so the
     old URL does not sit in the back button. /box/?id= is untouched — that
     one is printed on physical boxes and can never move. -->
<link rel="canonical" href="https://pocketseeds.online/seedbox/">
<meta name="robots" content="noindex,follow">
<meta http-equiv="refresh" content="0; url=../seedbox/">
<style>
  body{font-family:system-ui,-apple-system,sans-serif;background:#F1F6F0;color:#22242E;
    margin:0;display:grid;place-items:center;min-height:100vh;padding:24px;text-align:center}
  a{color:#2E8B49;font-weight:700}
</style>
</head>
<body>
<p>Moved to <a href="../seedbox/">the Seed Box page</a>.</p>
<script>location.replace('../seedbox/' + location.search + location.hash);</script>
</body>
</html>
