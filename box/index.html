<!doctype html>
<html lang="te">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Seed Box — PocketSeeds</title>
<meta name="description" content="Track a PocketSeeds ₹1,00,000 savings box. Tap a cell each time you drop cash in.">
<meta name="theme-color" content="#2E8B49">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M7 0h86a7 7 0 0 1 7 7v45.5C100 80.4 77.6 100 50 100S0 80.4 0 52.5V7a7 7 0 0 1 7-7z' fill='%232E8B49'/%3E%3Cpath d='M75.5 29.5C71.2 19.6 61.8 14 49.5 14 34.6 14 24.5 22.2 24.5 33.4c0 12.4 11.4 17.2 25.6 21.2 12.6 3.5 20.4 6.4 20.4 14.2 0 8.2-8.2 13.4-20.6 13.4-12.8 0-22.4-4.8-27.4-13.6' fill='none' stroke='white' stroke-width='17.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Noto+Sans+Telugu:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F7F6; --surface:#FFFFFF; --surface-2:#F2F6F3;
  --ink:#0E1B14; --muted:#6B7A72; --line:#E4EBE6;
  --brand:#0B7A43; --brand-2:#16A34A; --on-brand:#FFFFFF;
  --in-bg:#E6F4EC; --warn:#B45309; --warn-bg:#FEF3C7;
  --radius:18px; --shadow:0 1px 3px rgba(14,27,20,.06),0 6px 18px rgba(14,27,20,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0A120E;--surface:#121D17;--surface-2:#0E1712;--ink:#E7F0EA;
  --muted:#8FA398;--line:#1F2E26;--brand:#34D399;--brand-2:#34D399;--on-brand:#06231A;--in-bg:#0C2A1D;
  --warn:#FCD34D;--warn-bg:#2E2410;--shadow:0 2px 12px rgba(0,0,0,.45)}
}
:root[data-theme="dark"]{--bg:#0A120E;--surface:#121D17;--surface-2:#0E1712;--ink:#E7F0EA;
  --muted:#8FA398;--line:#1F2E26;--brand:#34D399;--brand-2:#34D399;--on-brand:#06231A;--in-bg:#0C2A1D;
  --warn:#FCD34D;--warn-bg:#2E2410;--shadow:0 2px 12px rgba(0,0,0,.45)}

*{box-sizing:border-box}
html,body{background:var(--bg);margin:0}
body{font-family:'Plus Jakarta Sans','Noto Sans Telugu',system-ui,-apple-system,sans-serif;
  color:var(--ink);line-height:1.6;font-size:16px;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:18px 14px 60px}
header{display:flex;align-items:center;gap:10px;padding:4px 0 14px}
.mark{width:32px;height:32px;flex:none}
.brand{font-weight:800;font-size:17px;letter-spacing:-.3px}
.brand span{color:var(--brand)}
.boxid{font-size:11.5px;font-weight:800;letter-spacing:.12em;color:var(--muted);margin-top:1px}
.tagpill{margin-left:auto;background:var(--in-bg);color:#1B5E34;border-radius:999px;padding:6px 11px;
  font-size:11px;font-weight:800;line-height:1.3;max-width:44%;text-align:center}
.lang{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.lang button{border:0;background:none;font-family:inherit;font-size:12px;font-weight:800;color:var(--muted);
  padding:0 8px;height:28px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}

section{background:var(--surface);border:1px solid var(--line);border-radius:20px;
  padding:17px;margin:0 0 13px;box-shadow:var(--shadow)}
h2{font-size:16.5px;margin:0 0 10px;letter-spacing:-.2px}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 12px;line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:13px;
  padding:13px 15px;font-family:inherit;font-size:15.5px;font-weight:800;cursor:pointer;text-decoration:none}
.btn-p{background:var(--brand);color:var(--on-brand)}
.btn-g{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn-block{display:flex;width:100%}
.btn:focus-visible{outline:3px solid #2E8B49;outline-offset:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stack{display:flex;flex-direction:column;gap:9px}
input[type=text]{width:100%;font-family:inherit;font-size:17px;font-weight:700;letter-spacing:.08em;
  padding:13px 14px;border-radius:13px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink)}
input:focus-visible{outline:3px solid #2E8B49;outline-offset:1px}

/* ---------- goal + ring ---------- */
.goal{text-align:center}
.goal .gt{font-size:19px;font-weight:800;letter-spacing:-.02em}
.goal .gs{font-size:13.5px;color:var(--muted);font-weight:600;margin-top:2px}
.ring{display:block;margin:14px auto 4px;width:172px;height:172px}
.ring .track{fill:none;stroke:var(--surface-2);stroke-width:13}
.ring .fill{fill:none;stroke:var(--brand);stroke-width:13;stroke-linecap:round;
  transform:rotate(-90deg);transform-origin:50% 50%;
  transition:stroke-dashoffset 1.1s cubic-bezier(.22,.9,.3,1)}
.ring .pc{font-size:30px;font-weight:800;fill:var(--ink);letter-spacing:-.03em}
.ring .pl{font-size:11px;font-weight:700;fill:var(--muted);letter-spacing:.1em}
@media (prefers-reduced-motion:reduce){ .ring .fill{transition:none} }
.done .ring .fill{stroke:#C7F000}

/* ---------- stat tiles ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:9px}
@media (min-width:560px){ .tiles{grid-template-columns:repeat(4,1fr)} }
.tile{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:11px 12px}
.tile .k{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.02em}
.tile .v{font-size:19px;font-weight:800;letter-spacing:-.02em;margin-top:3px;line-height:1.15}
.tile.saved .v{color:var(--brand)}
.tile.left .v{color:#B0431A}
.tile.prog .v{color:#1163A8}

/* ---------- the board ----------
   The printed face, drawn in its own row and column order. It must fit a
   360px screen whole, so the cell size is whatever the width allows and the
   number scales with it — see the note in the script about the tap target. */
/* Two modes over one row structure. Fit shows the whole face at once, which
   is what makes it recognisable as the box; zoom trades that for a cell you
   can hit, scrolling sideways. Either way the rows and the order within them
   are the print's, so a cell is in the same place in both. The negative
   margin cancels the card's own padding, so fit gets the full page width. */
.board{margin:0 -17px;padding:0 2px}
.board.zoom{overflow-x:auto;scrollbar-width:thin;padding-bottom:6px}
.brow{display:grid;grid-template-columns:repeat(var(--cols,10),1fr);gap:2px;margin-bottom:2px}
.board.zoom .brow{grid-template-columns:repeat(var(--cols,10),var(--zcell,44px));
  gap:3px;margin-bottom:3px;width:max-content}
.board.zoom .cell{font-size:13px}
.zoombar{display:flex;align-items:center;gap:8px;margin-top:10px}
.zoombar .seg{display:flex;background:var(--surface-2);border:1px solid var(--line);
  border-radius:11px;overflow:hidden}
.zoombar .seg button{border:0;background:none;font-family:inherit;font-size:13px;font-weight:800;
  color:var(--muted);padding:0 13px;height:34px;cursor:pointer}
.zoombar .seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.zoombar .hint{font-size:12px;color:var(--muted);line-height:1.35}
.cell{aspect-ratio:1;min-height:0;border-radius:6px;border:0;cursor:pointer;padding:0;
  font-family:inherit;font-weight:800;line-height:1;
  font-size:clamp(7px,2.7vw,13px);
  background:#5B3A21;color:#E8D8C3;
  display:grid;place-items:center;
  box-shadow:inset 0 -1px 0 rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.10);
  transition:background .14s,color .14s}
.cell[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);
  box-shadow:inset 0 2px 4px rgba(0,0,0,.28), inset 0 -1px 0 rgba(255,255,255,.14)}
.cell:focus-visible{outline:2px solid #C7F000;outline-offset:1px;z-index:1}
.cell:active{filter:brightness(1.14)}
.fault{background:#FCE6DC;border:1px solid #B0431A;color:#7A2B10;border-radius:12px;
  padding:11px 13px;margin:0 0 10px;font-size:13px;font-weight:700;line-height:1.45}

/* ---------- last savings ---------- */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.sec-h h2{margin:0}
.link{border:0;background:none;color:var(--brand);font-family:inherit;font-size:13.5px;font-weight:800;
  cursor:pointer;padding:2px 0}
table.hist{width:100%;border-collapse:collapse}
table.hist th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:700;
  letter-spacing:.04em;padding:0 0 7px}
table.hist th:last-child, table.hist td:last-child{text-align:right}
table.hist td{padding:8px 0;border-top:1px dashed var(--line);font-size:14.5px}
table.hist td:last-child{font-weight:800}
.mhead{display:flex;justify-content:space-between;gap:10px;margin:14px 0 4px;
  font-size:13px;font-weight:800;color:var(--brand)}
.mhead:first-child{margin-top:0}

/* ---------- tips ---------- */
ol.tips{margin:0;padding:0;list-style:none;counter-reset:tp}
ol.tips li{counter-increment:tp;display:flex;gap:11px;align-items:flex-start;padding:9px 0;
  border-bottom:1px dashed var(--line);font-size:14px;line-height:1.5}
ol.tips li:last-child{border:0;padding-bottom:0}
ol.tips li::before{content:counter(tp);flex:none;width:24px;height:24px;border-radius:50%;
  background:var(--in-bg);color:#1B5E34;font-weight:800;font-size:12.5px;display:grid;place-items:center;
  margin-top:1px}

.boxes{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.boxes a{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:7px 13px;
  font-size:13px;font-weight:800;text-decoration:none;color:var(--ink);letter-spacing:.06em}
.boxes a.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(14,27,20,.5);z-index:60;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--surface);
  border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  max-height:82vh;overflow-y:auto;transform:translateY(100%);
  transition:transform .32s cubic-bezier(.22,.9,.3,1);max-width:760px;margin:0 auto}
.sheet.on{transform:none}
.sheet h3{margin:0 0 4px;font-size:18px}
@media (prefers-reduced-motion:reduce){ .sheet{transition:none} }

.cheer{position:fixed;left:50%;bottom:24px;transform:translate(-50%,140%);z-index:70;max-width:92vw;
  background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 18px;font-weight:800;font-size:15px;
  box-shadow:0 12px 30px rgba(0,0,0,.3);transition:transform .38s cubic-bezier(.22,.9,.3,1)}
.cheer.on{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){ .cheer{transition:none} }
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
footer{text-align:center;color:var(--muted);font-size:14px;padding:20px 0 0;margin-top:16px;
  border-top:1px solid var(--line)}
footer a{color:var(--brand);font-weight:700}
.te{font-family:'Noto Sans Telugu','Plus Jakarta Sans',sans-serif}
</style>
</head>
<body>
<div class="wrap">
<header>
  <svg class="mark" viewBox="0 0 100 100" aria-hidden="true"><path d="M7 0h86a7 7 0 0 1 7 7v45.5C100 80.4 77.6 100 50 100S0 80.4 0 52.5V7a7 7 0 0 1 7-7z" fill="#2E8B49"/><path d="M75.5 29.5C71.2 19.6 61.8 14 49.5 14 34.6 14 24.5 22.2 24.5 33.4c0 12.4 11.4 17.2 25.6 21.2 12.6 3.5 20.4 6.4 20.4 14.2 0 8.2-8.2 13.4-20.6 13.4-12.8 0-22.4-4.8-27.4-13.6" fill="none" stroke="white" stroke-width="17.5"/></svg>
  <div><div class="brand">Pocket<span>seeds</span></div>
    <div class="boxid" id="hdrId">—</div></div>
  <div class="tagpill" data-t="tagline"></div>
  <div class="lang" id="langPick">
    <button data-lang="te" aria-pressed="false">తె</button>
    <button data-lang="en" aria-pressed="false">EN</button>
  </div>
</header>

<div id="app"></div>
<p class="sr" id="live" role="status" aria-live="polite"></p>
<div class="cheer" id="cheer"></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>

<footer>
  <a href="../">&larr; <span data-t="backApp"></span></a> &nbsp;·&nbsp;
  <a href="../seedbox/" id="aboutBox"><span data-t="aboutBox"></span></a>
</footer>
</div>

<script>
'use strict';
/* ==================== SEED BOX — TRACKER ====================
   Opened by the QR on the box: /box/?id=BOX0001

   THE GRID IS DATA. Everything printed on the box face is in the three
   constants below — the denominations, the shape, and the frozen order they
   are printed in. The page follows them, and tools/face.js prints from the
   same values, so the screen and the box cannot drift apart. The sum is
   asserted on load, because a grid that does not add up to the goal is a bug
   the reader would only find at the very end.

   The feature is called Seed Box in every string a person reads, and
   moneybox in every key and path they do not. That is deliberate, not a
   leftover: these keys are already on people's phones, and this page's URL
   is printed on wooden boxes, so moving either would lose a count or kill a
   QR code.

   Storage is per box, so one person can keep several:
     moneybox:<BOXID> = { boxId, startedAt, goal, cells:[{id,amount,filledAt}],
                          syncedTotal, milestones, updatedAt }
   The app's own store (pocketseeds.v2) is only touched by "Add to my savings",
   and then only by the amount not already sent, so tapping it twice cannot
   double-count.
   ============================================================ */

/* ---------------------------------------------------------------
   THE PRINTED FACE — these three constants are the box, and the only
   things to edit when the print changes.

   MB_CELLS is the bill of materials: each entry is a denomination and how
   many of that cell the face carries. It says nothing about position.

   MB_FACE_ROWS is the face's shape: one number per printed row, being how
   many columns that row has. A short final row is fine — say [10,10,10,7].

   MB_FACE_ORDER is the printed sequence, frozen: reading order across the
   face, left to right then down. The app draws from it, so a cell's position
   on screen is its position on the box.

   Four assertions, all loud, because any of them being wrong breaks the whole
   mechanic: fill a printed cell, tap the same cell here.
   --------------------------------------------------------------- */
const MB_GOAL  = 100000;

/* The ladder. Twenty rows of ten, each row one amount, so every row is worth
   exactly a tenth of the goal and the ten of them add to it. It is a MENU,
   not a schedule: a saver taps whichever cell they can afford today — a ₹20
   on a lean day, a ₹1,250 on a good one — in any order they like. Nothing
   here implies a week, a sequence, or a cell you owe. */
const MB_CELLS = [
  { amount:   20, count: 10 }, { amount:   40, count: 10 },
  { amount:   60, count: 10 }, { amount:   80, count: 10 },
  { amount:  100, count: 10 }, { amount:  150, count: 10 },
  { amount:  200, count: 10 }, { amount:  250, count: 10 },
  { amount:  300, count: 10 }, { amount:  350, count: 10 },
  { amount:  400, count: 10 }, { amount:  500, count: 10 },
  { amount:  600, count: 10 }, { amount:  700, count: 10 },
  { amount:  800, count: 10 }, { amount:  900, count: 10 },
  { amount: 1000, count: 10 }, { amount: 1100, count: 10 },
  { amount: 1200, count: 10 }, { amount: 1250, count: 10 }
];                                  // = ₹1,00,000 across 200 cells
const MB_FACE_ROWS = Array.from({ length: 20 }, () => 10);   // 20 rows of 10

/* MB_FACE_ORDER is the face, frozen.

   MB_CELLS above is only a bill of materials — how many of each denomination
   the face carries. It says nothing about where they sit, and reading it in
   order would draw the board as twenty solid bands, which is not what the box
   looks like. This array is the actual printed sequence, reading order across
   the face, left to right then down.

   It was produced once by the seeded shuffle in tools/face.js (seed 20260904)
   and then written down here, rather than being recomputed at run time in two
   places that could drift apart. The app draws from it and the printer prints
   from it, so a cell's position on screen is its position on the box.

   DO NOT REORDER OR EDIT BY HAND. Every box already printed carries this
   layout; changing it makes those boxes disagree with the app. A new face
   means a new order: run `node tools/face.js --make-order` and paste the
   result over this whole array, and understand you have invalidated the
   existing print run. */
const MB_FACE_ORDER = [
  1250, 1100,   20,  250,  400,  350,  800,  700, 1250,  100,
  1200,  200,   80,  600,   40,  500,  100,  350, 1250, 1000,
  1100,  700,  100,  350,  800,  300, 1200,  350,   80, 1200,
    20,  800,  600, 1250,  400, 1200,  300,  250,  700,  300,
   350, 1200,  900,   80,  200,  150,  500,  800,  350,  900,
  1100,   40,  300,  250,  600, 1000,  400,   20,  200,  250,
    40,  900,  200, 1000,  800,  600,  150,   80,  900,   20,
   100, 1100,  250,   20,  700,   60,  600, 1100,  250,   20,
   900,  500,   60,  350,  200,  700, 1100,  150,  600,  400,
  1000, 1250,   20,  400,  400, 1250,  100,   20,  150,  300,
   250,  200,  800,   60, 1100,  900,  700,  500,  300,   60,
   600, 1000, 1250,   40,  100,  200,  500,   80, 1000,  150,
    40, 1100, 1250,   40,  200,   40,  300,  350,  500,   80,
   800,  100,  500,  300,  600,  350, 1000, 1000, 1000,  500,
   800, 1200,   60, 1100,  250,   40,  700,  100,  500,  800,
   100,  150,  800,  700,  350,  150,   60,   60,  200,   40,
    60,  600, 1100,   20,  400, 1200, 1200,  200, 1200,  300,
    80,  900,  250,  900,   80,   80,  500, 1250,   80,  400,
  1250,  700,  900,  400, 1200,   40,  100,   20, 1000,  900,
   150,   60,  400,  600,  250,  300,   60,  150,  700,  150
];

const MB_PLANNED = MB_CELLS.reduce((n, g) => n + g.amount * g.count, 0);
const MB_COUNT   = MB_CELLS.reduce((n, g) => n + g.count, 0);
const MB_ROWED   = MB_FACE_ROWS.reduce((n, c) => n + c, 0);
/* every row is laid out on the widest row's tracks, so the columns line up
   down the face even when the last row is short */
const MB_FACE_COLS = Math.max(1, ...MB_FACE_ROWS);

const MB_FAULTS = [];
if(MB_PLANNED !== MB_GOAL)
  MB_FAULTS.push('cells add up to ' + MB_PLANNED + ', not ' + MB_GOAL);
if(MB_ROWED !== MB_COUNT)
  MB_FAULTS.push('the face has ' + MB_ROWED + ' cells across its rows, but MB_CELLS declares ' + MB_COUNT);
if(MB_FACE_ORDER.length !== MB_COUNT)
  MB_FAULTS.push('MB_FACE_ORDER lists ' + MB_FACE_ORDER.length + ' cells, but MB_CELLS declares ' + MB_COUNT);
/* the printed order must be the bill of materials rearranged and nothing
   else: same denominations, same counts of each, so no cell was invented,
   dropped or silently retyped when the order was frozen */
(() => {
  const want = new Map(), got = new Map();
  MB_CELLS.forEach(g => want.set(g.amount, (want.get(g.amount) || 0) + g.count));
  MB_FACE_ORDER.forEach(a => got.set(a, (got.get(a) || 0) + 1));
  const off = [...new Set([...want.keys(), ...got.keys()])]
    .filter(a => (want.get(a) || 0) !== (got.get(a) || 0));
  if(off.length) MB_FAULTS.push('MB_FACE_ORDER is not MB_CELLS rearranged — ' + off.map(a =>
    '₹' + a + ': the face has ' + (got.get(a) || 0) + ', the cells declare ' + (want.get(a) || 0)).join('; '));
})();
const MB_ORDER_SUM = MB_FACE_ORDER.reduce((n, a) => n + a, 0);
if(MB_ORDER_SUM !== MB_GOAL)
  MB_FAULTS.push('the printed order adds up to ' + MB_ORDER_SUM + ', not ' + MB_GOAL);
/* Loud on purpose, and on the page rather than only in the console: a face
   that does not match the print is not a cosmetic bug, it is the reader
   tapping the wrong cell. */
MB_FAULTS.forEach(f => console.error('MoneyBox: ' + f));

const APP_KEY   = 'pocketseeds.v2';
const LAST_BOX  = 'moneybox.last';
/* A dot, not a colon: moneybox:* is the box records, and a preference is not
   a box. knownBoxes() would otherwise read this as one. */
const ZOOM_KEY  = id => 'moneybox.zoom.' + id;
let ZOOM = false;
const BOX_RE    = /^BOX\d{4,6}$/;

const MONTHS = {
  te:['జన','ఫిబ్ర','మార్చి','ఏప్రి','మే','జూన్','జూలై','ఆగ','సెప్ట','అక్టో','నవం','డిసెం'],
  en:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']
};
const STR = {
  te: {

  let s = (STR[LMODE] && STR[LMODE][k]) || STR.en[k] || k;
  if(v) Object.keys(v).forEach(x => { s = s.split('{'+x+'}').join(v[x]); });
  return s;
};

  if(v !== 'auto') document.documentElement.setAttribute('data-theme', v); })();

const $  = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = n => '₹' + Math.round(Number(n) || 0).toLocaleString('en-IN');
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
/* the app's own date shape: day then short month, in the reader's language */
function shortDate(s2){
  const [y,m,d] = String(s2).split('-').map(Number);
  if(!y || !m) return String(s2);
  return d + ' ' + (MONTHS[LMODE] || MONTHS.en)[m-1];
}
function monthLabel(k){
  const [y,m] = String(k).split('-').map(Number);
  return (MONTHS[LMODE] || MONTHS.en)[m-1] + ' ' + y;
}

/* ---------------- state ---------------- */
let BOX = null;

function boxKey(id){ return 'moneybox:' + id; }
function blankBox(id){
  /* built in PRINTED order, so cells[n] is the nth cell on the box. The id
     stays keyed to the denomination and its nth occurrence rather than to the
     position, so if the face is ever re-cut a filled ₹500 can only ever be
     restored onto a ₹500 — never onto whatever now happens to sit at that
     index. */
  const cells = [], seen = {};
  MB_FACE_ORDER.forEach(a => {
    const n = seen[a] = (seen[a] || 0) + 1;
    cells.push({ id: a + '-' + (n - 1), amount: a, filledAt: null });
  });
  return { boxId:id, startedAt:ymd(new Date()), goal:MB_GOAL, cells,
           syncedTotal:0, milestones:[], updatedAt:Date.now() };
}
function loadBox(id){
  try{
    const raw = JSON.parse(localStorage.getItem(boxKey(id)) || 'null');
    if(!raw || !Array.isArray(raw.cells)) return blankBox(id);
    /* the printed face may have been edited since; keep what was filled and
       re-shape the rest, so a config change never loses someone's count */
    const filled = new Map(raw.cells.filter(c => c.filledAt).map(c => [c.id, c.filledAt]));
    const fresh = blankBox(id);
    fresh.cells.forEach(c => { if(filled.has(c.id)) c.filledAt = filled.get(c.id); });
    fresh.startedAt   = raw.startedAt || fresh.startedAt;
    fresh.syncedTotal = Number(raw.syncedTotal) || 0;
    fresh.milestones  = Array.isArray(raw.milestones) ? raw.milestones : [];
    return fresh;
  }catch(e){ return blankBox(id); }
}
function saveBox(){
  BOX.updatedAt = Date.now();
  try{ localStorage.setItem(boxKey(BOX.boxId), JSON.stringify(BOX)); }catch(e){}
  try{ localStorage.setItem(LAST_BOX, BOX.boxId); }catch(e){}
}
function knownBoxes(){
  const out = [];
  for(let i = 0; i < localStorage.length; i++){
    const k = localStorage.key(i);
    if(k && k.startsWith('moneybox:')) out.push(k.slice(9));
  }
  return out.sort();
}

const filledCells = () => BOX.cells.filter(c => c.filledAt);
const total  = () => filledCells().reduce((n, c) => n + c.amount, 0);
const pctOf  = () => Math.min(100, total() / BOX.goal * 100);
const pct1   = () => (Math.round(pctOf() * 10) / 10).toFixed(1);

function byMonth(){
  const m = {};
  filledCells().forEach(c => { const k = c.filledAt.slice(0,7); m[k] = (m[k]||0) + c.amount; });
  return Object.keys(m).sort().reverse().map(k => ({ k, amount:m[k] }));
}
/* newest first; within a day, the later cell in printed order reads as later */
function recent(n){
  return filledCells().slice().sort((a,b) =>
    a.filledAt === b.filledAt ? 0 : (a.filledAt < b.filledAt ? 1 : -1)).slice(0, n);
}

/* ---------------- celebration ----------------
   Which milestones have been seen lives in the stored box, not in a variable,
   so reopening the page does not congratulate someone all over again. */
function cheer(msg){
  const el = $('#cheer'); el.textContent = msg;
  el.classList.add('on');
  clearTimeout(cheer._t);
  cheer._t = setTimeout(() => el.classList.remove('on'), 2600);
}
function checkMilestones(){
  const p = pctOf();
  BOX.milestones = BOX.milestones || [];
  [[100,'c100'],[75,'c75'],[50,'c50'],[25,'c25']].some(([mark, key]) => {
    if(p >= mark && BOX.milestones.indexOf(mark) === -1){
      BOX.milestones.push(mark); saveBox(); cheer(t(key)); return true;
    }
    return false;
  });
}

/* ---------------- the app store ---------------- */
function addToSavings(){
  const owed = total() - (BOX.syncedTotal || 0);
  if(owed <= 0){ cheer(t('nothingNew')); return; }
  try{
    const db = JSON.parse(localStorage.getItem(APP_KEY) || 'null');
    if(!db) { cheer(t('nothingNew')); return; }
    db.savings = db.savings || [];
    /* the note is display text in the app's savings list, so it takes the
       new name; entries written before the rename keep the old wording */
    db.savings.push({ id:uid(), amount:owed, note:'Seed Box ' + BOX.boxId, date:ymd(new Date()) });
    localStorage.setItem(APP_KEY, JSON.stringify(db));
    BOX.syncedTotal = total(); saveBox(); paintTotals();
    cheer(t('addedSav', { a: money(owed) }));
  }catch(e){ cheer(t('nothingNew')); }
}

/* the flat run of cells chopped into the printed rows */
function faceRows(){
  const rows = [];
  let i = 0;
  MB_FACE_ROWS.forEach(n => { rows.push(BOX.cells.slice(i, i + n)); i += n; });
  if(i < BOX.cells.length) rows.push(BOX.cells.slice(i));
  return rows.filter(r => r.length);
}

}

  paintChrome();
  /* the sweep runs on load only: the ring starts empty and animates to the
     real figure once, then every later change is a plain number update */
  requestAnimationFrame(() => paintRing());
}

function paintChrome(){
  document.querySelectorAll('.lang button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.lang === LMODE)));
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
}
function paintRing(){
  const f = $('#ringFill'); if(!f) return;
  f.style.strokeDashoffset = (RING_C * (1 - Math.min(1, pctOf() / 100))).toFixed(1);
}
function paintTotals(){
  const saved = total(), p = pctOf();
  const set = (id, v) => { const el = $(id); if(el) el.textContent = v; };
  set('#tSaved', money(saved));
  set('#tLeft',  money(Math.max(0, BOX.goal - saved)));
  set('#tProg',  pct1() + '%');
  set('#ringPc', pct1() + '%');
  paintRing();
  const g = $('#goalSec'); if(g) g.classList.toggle('done', p >= 100);
  const lb = $('#lastBox'); if(lb) lb.innerHTML = recentHTML();
  const va = $('#viewAll'); if(va) va.hidden = !filledCells().length;
  const pl = document.querySelector('.ring .pl');
  if(pl) pl.textContent = p >= 100 ? t('reached') : t('ringL');
}

function toggleCell(id){
  const c = BOX.cells.find(x => x.id === id);
  if(!c) return;
  c.filledAt = c.filledAt ? null : ymd(new Date());
  saveBox();
  /* patch the one tile rather than repainting the whole board — a re-render
     per tap loses the scroll position and the focus ring */
  const btn = document.querySelector('[data-cell="' + CSS.escape(id) + '"]');
  if(btn) btn.setAttribute('aria-pressed', String(!!c.filledAt));
  paintTotals();
  announce();
  if(c.filledAt) checkMilestones();
}
function announce(){
  $('#live').textContent = t('announce', { a: money(total()), p: pct1() });
}
function undoLast(){
  const filled = filledCells();
  if(!filled.length){ cheer(t('nothingUndo')); return; }
  const last = filled.slice().sort((a,b) =>
    a.filledAt === b.filledAt ? 0 : (a.filledAt < b.filledAt ? -1 : 1)).pop();
  last.filledAt = null;
  saveBox();
  const btn = document.querySelector('[data-cell="' + CSS.escape(last.id) + '"]');
  if(btn) btn.setAttribute('aria-pressed', 'false');
  paintTotals(); announce(); cheer(t('undone'));
}
function resetBox(){
  if(!confirm(t('resetAsk') + '\n\n' + t('resetYes'))) return;
  BOX = blankBox(BOX.boxId);
  saveBox(); render(); announce();
}
function share(){
  const txt = t('shareTxt', { a: money(total()), p: pct1() }) + 'https://pocketseeds.online/seedbox/';
  if(navigator.share){ navigator.share({ text: txt }).catch(()=>{}); return; }
  window.open('https://wa.me/?text=' + encodeURIComponent(txt), '_blank', 'noopener');
}

document.addEventListener('click', e => {
  const c = e.target.closest('[data-cell]');
  if(c) toggleCell(c.dataset.cell);
});
$('#langPick').addEventListener('click', e => {
  const b = e.target.closest('button[data-lang]'); if(!b || b.dataset.lang === LMODE) return;
  LMODE = b.dataset.lang;
  localStorage.setItem('pocketseeds.lmode', LMODE);
  document.documentElement.lang = LMODE;
  BOX ? render() : askView();
  paintChrome();
});

/* ---------------- boot ---------------- */
(function(){
  document.documentElement.lang = LMODE;
  const q = new URLSearchParams(location.search).get('id');
  const id = (q || localStorage.getItem(LAST_BOX) || '').trim().toUpperCase();
  document.querySelectorAll('.lang button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.lang === LMODE)));
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  if(!id || !BOX_RE.test(id)){ askView(); return; }
  BOX = loadBox(id);
  try{ ZOOM = localStorage.getItem(ZOOM_KEY(id)) === 'big'; }catch(e){}
  /* a box opened for the first time starts counting from today */
  if(!localStorage.getItem(boxKey(id))) saveBox();
  render(); announce();
})();
</script>
</body>
</html>
