name: Daily metal rates

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  rates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch gold and silver rates
        env:
          GOLDAPI_KEY: ${{ secrets.GOLDAPI_KEY }}
        run: |
          GOLD_RESPONSE=$(curl -s "https://www.goldapi.io/api/XAU/USD?api_key=$GOLDAPI_KEY")
          GOLD_PRICE=$(echo $GOLD_RESPONSE | jq '.price')
          GOLD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          SILVER_RESPONSE=$(curl -s "https://www.goldapi.io/api/XAG/USD?api_key=$GOLDAPI_KEY")
          SILVER_PRICE=$(echo $SILVER_RESPONSE | jq '.price')
          
          cat > rates.json <<EOF
          {
            "timestamp": "$(date +%s)",
            "date": "$GOLD_DATE",
            "gold": {
              "price": $GOLD_PRICE,
              "currency": "USD",
              "unit": "per troy ounce"
            },
            "silver": {
              "price": $SILVER_PRICE,
              "currency": "USD",
              "unit": "per troy ounce"
            }
          }
          EOF

      - name: Configure git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet rates.json; then
            echo "No changes to commit"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git add rates.json
            git commit -m "Update metal rates $(date +%Y-%m-%d)"
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Pull remote changes
        if: steps.commit.outputs.changed == 'true'
        run: |
          git pull --no-edit origin main || git pull --no-edit origin master

      - name: Push changes
        if: steps.commit.outputs.changed == 'true'
        run: |
          git push origin main || git push origin master
